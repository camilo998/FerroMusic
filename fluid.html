<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Avanzado de Fluido Orgánico - WebGL</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #ffffff;
            cursor: pointer;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<!-- Importar Three.js para facilitar la manipulación de mallas 3D y luces en WebGL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. Configuración de la escena, cámara y renderizador WebGL
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff); // Fondo blanco puro

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 2. Luces para simular el brillo metálico del líquido
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 3. Crear una geometría esférica con muchos vértices para poder deformarla (Fluido orgánico)
    const geometry = new THREE.SphereGeometry(1.5, 128, 128);
    
    // Guardar las posiciones originales de los vértices para calcular las ondas
    const positionAttribute = geometry.attributes.position;
    const initialPositions = positionAttribute.clone();

    // Material negro brillante (efecto brea / ferrofluido pulido)
    const material = new THREE.MeshPhysicalMaterial({
        color: 0x050505,
        metalness: 0.9,
        roughness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
    });

    const fluidMesh = new THREE.Mesh(geometry, material);
    scene.add(fluidMesh);

    // 4. Interacción con el Mouse (Vector en el espacio 3D)
    const mouse = new THREE.Vector2(-1000, -1000);
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const raycaster = new THREE.Raycaster();
    const mouseWorldPos = new THREE.Vector3();

    window.addEventListener('mousemove', (event) => {
        // Normalizar coordenadas del mouse entre -1 y 1
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        raycaster.ray.intersectPlane(planeZ, mouseWorldPos);
    });

    // 5. Bucle de Animación y Deformación Física de Vértices
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const time = clock.getElapsedTime();
        const pos = positionAttribute;

        // Recorrer cada vértice de la esfera para moverlo dinámicamente
        for (let i = 0; i < pos.count; i++) {
            let initX = initialPositions.getX(i);
            let initY = initialPositions.getY(i);
            let initZ = initialPositions.getZ(i);

            // Coordenadas actuales del vértice en el mundo 3D
            let vertexPos = new THREE.Vector3(initX, initY, initZ);
            vertexPos.applyMatrix4(fluidMesh.matrixWorld);

            // Calcular distancia entre el vértice y la posición del mouse
            let distanceToMouse = vertexPos.distanceTo(mouseWorldPos);

            // Si el mouse está cerca, aplicamos una fuerza de repulsión o atracción puntiaguda
            let displacement = 0;
            if (distanceToMouse < 2.0) {
                // Efecto de picos hacia el cursor
                let factor = Math.max(0, 1.0 - distanceToMouse / 2.0);
                displacement = Math.sin(time * 10.0 + i) * 0.3 * factor;
            }

            // Ondas orgánicas base (latido del fluido)
            let wave = Math.sin(initX * 3.0 + time * 3.0) * Math.cos(initY * 3.0 + time * 2.0) * 0.08;

            // Aplicar nueva posición al vértice a lo largo de su normal
            let length = Math.sqrt(initX*initX + initY*initY + initZ*initZ);
            let nx = initX / length;
            let ny = initY / length;
            let nz = initZ / length;

            let finalDist = length + wave + displacement;
            pos.setXYZ(i, nx * finalDist, ny * finalDist, nz * finalDist);
        }

        pos.needsUpdate = true;
        fluidMesh.rotation.y = time * 0.1; // Rotación lenta de la masa

        renderer.render(scene, camera);
    }

    animate();

    // Ajustar si se cambia el tamaño de la ventana
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
